<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compila Area - La Mia Vita</title>
    <link rel="stylesheet" href="../../style.css">
    <style>
        .form-container {
            max-width: 700px;
            margin: 40px auto;
            padding: 30px;
            background: #1a1a1a;
            border-radius: 15px;
            border: 2px solid #667eea;
        }
        
        .progress-bar-container {
            width: 100%;
            height: 10px;
            background: #333;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }
        
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }
        
        .question {
            margin-bottom: 30px;
        }
        
        .question h3 {
            color: #667eea;
            margin-bottom: 15px;
        }
        
        .question input,
        .question textarea,
        .question select {
            width: 100%;
            padding: 12px;
            background: #0a0a0a;
            border: 2px solid #333;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 1em;
            font-family: inherit;
        }
        
        .question textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        .question input:focus,
        .question textarea:focus,
        .question select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        
        .btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            font-weight: bold;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        
        .btn-secondary {
            background: transparent;
            border: 2px solid #667eea;
            color: #667eea;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <a href="../../index-struttura.html" class="logo">📖 Enciclopedia della Vita</a>
        </div>
    </header>

    <div class="content-wrapper">
        <h1 style="color: #667eea; margin-bottom: 10px;" id="areaTitle">Compila Area</h1>
        <p style="color: #a0a0a0; margin-bottom: 30px;">Rispondi alle domande per tracciare i tuoi progressi</p>
        
        <div class="form-container">
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progressBar" style="width: 0%"></div>
            </div>
            
            <div id="questionContainer"></div>
            
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="annulla()">Annulla</button>
                <button class="btn btn-primary" onclick="salva()">Salva</button>
            </div>
        </div>
    </div>

    <script>
    const utenteCorrente = localStorage.getItem('utenteCorrente');
    if (!utenteCorrente) {
        window.location.href = '../../login.html';
    }
    
    const areeDefinizioni = {
        'salute': {
            nome: 'Salute Fisica',
            domande: [
                { id: 'attivita_fisica', tipo: 'number', label: 'Quante ore di attività fisica fai a settimana?', min: 0, max: 20 },
                { id: 'alimentazione', tipo: 'select', label: 'Come valuti la tua alimentazione?', opzioni: ['Pessima', 'Migliorabile', 'Buona', 'Ottima'] },
                { id: 'sonno', tipo: 'number', label: 'Quante ore dormi mediamente?', min: 0, max: 12, step: 0.5 },
                { id: 'obiettivi_salute', tipo: 'textarea', label: 'Quali sono i tuoi obiettivi di salute?' }
            ]
        },
        'soldi': {
            nome: 'Finanze',
            domande: [
                { id: 'budget_mensile', tipo: 'select', label: 'Hai un budget mensile definito?', opzioni: ['No', 'Sto iniziando', 'Sì, definito'] },
                { id: 'risparmio', tipo: 'number', label: 'Che percentuale del tuo reddito risparmi?', min: 0, max: 100, step: 5 },
                { id: 'fondo_emergenze', tipo: 'select', label: 'Hai un fondo emergenze?', opzioni: ['No', 'In costruzione', 'Sì (3-6 mesi spese)'] },
                { id: 'obiettivi_finanziari', tipo: 'textarea', label: 'Quali sono i tuoi obiettivi finanziari?' }
            ]
        },
        'relazioni': {
            nome: 'Relazioni',
            domande: [
                { id: 'tempo_relazioni', tipo: 'number', label: 'Quante ore dedichi alle relazioni importanti ogni settimana?', min: 0, max: 50 },
                { id: 'qualita_relazioni', tipo: 'select', label: 'Come valuti la qualità delle tue relazioni?', opzioni: ['Da migliorare', 'Accettabile', 'Buona', 'Ottima'] },
                { id: 'gestione_conflitti', tipo: 'select', label: 'Come gestisci i conflitti?', opzioni: ['Li evito', 'Con difficoltà', 'Abbastanza bene', 'In modo costruttivo'] },
                { id: 'obiettivi_relazioni', tipo: 'textarea', label: 'Cosa vorresti migliorare nelle tue relazioni?' }
            ]
        },
        'lavoro': {
            nome: 'Carriera',
            domande: [
                { id: 'situazione', tipo: 'select', label: 'Situazione lavorativa attuale', opzioni: ['Disoccupato', 'Studente', 'Lavoratore part-time', 'Lavoratore full-time', 'Imprenditore'] },
                { id: 'soddisfazione', tipo: 'select', label: 'Soddisfazione lavorativa', opzioni: ['Insoddisfatto', 'Neutrale', 'Soddisfatto', 'Molto soddisfatto'] },
                { id: 'sviluppo_skill', tipo: 'select', label: 'Stai sviluppando nuove competenze?', opzioni: ['No', 'Saltuariamente', 'Costantemente'] },
                { id: 'obiettivi_carriera', tipo: 'textarea', label: 'Quali sono i tuoi obiettivi di carriera?' }
            ]
        }
    };
    
    const urlParams = new URLSearchParams(window.location.search);
    const areaId = urlParams.get('area');
    const areaDef = areeDefinizioni[areaId];
    
    if (!areaDef) {
        alert('Area non trovata');
        window.location.href = 'la-mia-vita.html';
    }
    
    document.getElementById('areaTitle').textContent = areaDef.nome;
    
    function renderDomande() {
        const container = document.getElementById('questionContainer');
        
        container.innerHTML = areaDef.domande.map(d => {
            let inputHTML = '';
            
            if (d.tipo === 'number') {
                inputHTML = `<input type="number" id="${d.id}" min="${d.min || 0}" max="${d.max || 100}" step="${d.step || 1}">`;
            } else if (d.tipo === 'select') {
                inputHTML = `<select id="${d.id}">
                    <option value="">-- Seleziona --</option>
                    ${d.opzioni.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
                </select>`;
            } else if (d.tipo === 'textarea') {
                inputHTML = `<textarea id="${d.id}" placeholder="Scrivi qui..."></textarea>`;
            }
            
            return `<div class="question">
                <h3>${d.label}</h3>
                ${inputHTML}
            </div>`;
        }).join('');
        
        caricaDatiEsistenti();
    }
    
    function caricaDatiEsistenti() {
        const utenti = JSON.parse(localStorage.getItem('utenti') || '{}');
        const datiArea = utenti[utenteCorrente]?.dati?.[areaId] || {};
        
        areaDef.domande.forEach(d => {
            const el = document.getElementById(d.id);
            if (el && datiArea[d.id]) {
                el.value = datiArea[d.id];
            }
        });
        
        aggiornaProgress();
    }
    
    function aggiornaProgress() {
        let risposte = 0;
        
        areaDef.domande.forEach(d => {
            const el = document.getElementById(d.id);
            if (el && el.value && el.value.trim()) {
                risposte++;
            }
        });
        
        const percentuale = Math.round((risposte / areaDef.domande.length) * 100);
        document.getElementById('progressBar').style.width = percentuale + '%';
    }
    
    document.addEventListener('input', aggiornaProgress);
    
    function salva() {
        const utenti = JSON.parse(localStorage.getItem('utenti') || '{}');
        
        if (!utenti[utenteCorrente].dati[areaId]) {
            utenti[utenteCorrente].dati[areaId] = {};
        }
        
        areaDef.domande.forEach(d => {
            const el = document.getElementById(d.id);
            if (el) {
                utenti[utenteCorrente].dati[areaId][d.id] = el.value;
            }
        });
        
        utenti[utenteCorrente].dati[areaId].ultimoAggiornamento = new Date().toISOString();
        
        localStorage.setItem('utenti', JSON.stringify(utenti));
        
        alert('Dati salvati!');
        window.location.href = 'la-mia-vita.html';
    }
    
    function annulla() {
        if (confirm('Vuoi davvero uscire senza salvare?')) {
            window.location.href = 'la-mia-vita.html';
        }
    }
    
    renderDomande();
    </script>
</body>
</html>
