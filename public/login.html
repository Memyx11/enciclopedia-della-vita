<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Enciclopedia della Vita</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 40px;
            background: #1a1a1a;
            border-radius: 15px;
            border: 2px solid #333;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-header h1 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #a0a0a0;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            background: #0a0a0a;
            border: 2px solid #333;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 1em;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
        }
        
        .btn-login:hover {
            opacity: 0.9;
        }
        
        .toggle-form {
            text-align: center;
            color: #a0a0a0;
            margin-top: 20px;
        }
        
        .toggle-form a {
            color: #667eea;
            text-decoration: none;
            cursor: pointer;
        }
        
        .error-message {
            background: #4d1a1a;
            color: #ef4444;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Enciclopedia della Vita</h1>
            <p style="color: #a0a0a0;" id="headerText">Accedi al tuo profilo</p>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn-login" id="submitBtn">Accedi</button>
        </form>

        <div class="toggle-form">
            <span id="toggleText">Non hai un account? <a onclick="toggleModalita()">Registrati</a></span>
        </div>

        <div class="toggle-form" style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #333;">
            <a href="index.html" style="color: #667eea;">← Torna alla home (senza login)</a>
        </div>
    </div>

    <script>
    let modalitaRegistrazione = false;

    function getUtenti() {
        const utenti = localStorage.getItem('utenti');
        return utenti ? JSON.parse(utenti) : {};
    }

    function salvaUtenti(utenti) {
        localStorage.setItem('utenti', JSON.stringify(utenti));
    }

    function mostraErrore(messaggio) {
        const errorDiv = document.getElementById('errorMessage');
        errorDiv.textContent = messaggio;
        errorDiv.style.display = 'block';
        setTimeout(() => {
            errorDiv.style.display = 'none';
        }, 4000);
    }

    function toggleModalita() {
        modalitaRegistrazione = !modalitaRegistrazione;
        
        if (modalitaRegistrazione) {
            document.getElementById('headerText').textContent = 'Crea il tuo profilo';
            document.getElementById('submitBtn').textContent = 'Registrati';
            document.getElementById('toggleText').innerHTML = 'Hai già un account? <a onclick="toggleModalita()">Accedi</a>';
        } else {
            document.getElementById('headerText').textContent = 'Accedi al tuo profilo';
            document.getElementById('submitBtn').textContent = 'Accedi';
            document.getElementById('toggleText').innerHTML = 'Non hai un account? <a onclick="toggleModalita()">Registrati</a>';
        }
        
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
        document.getElementById('errorMessage').style.display = 'none';
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const utenti = getUtenti();
        
        if (modalitaRegistrazione) {
            // MODALITÀ REGISTRAZIONE
            if (username.length < 3) {
                mostraErrore('Username deve avere almeno 3 caratteri.');
                return;
            }
            
            if (password.length < 6) {
                mostraErrore('Password deve avere almeno 6 caratteri.');
                return;
            }
            
            // CONTROLLO CRITICO: username già esistente
            if (utenti[username]) {
                mostraErrore('Username "' + username + '" già esistente. Scegline un altro o accedi.');
                return;
            }
            
            // Registrazione OK
            utenti[username] = {
                password: password,
                dataCreazione: new Date().toISOString(),
                dati: {}
            };
            
            salvaUtenti(utenti);
            localStorage.setItem('utenteCorrente', username);
            window.location.href = 'pagine/la-mia-vita.html';
            
        } else {
            // MODALITÀ LOGIN
            if (!utenti[username]) {
                mostraErrore('Username non trovato. Registrati prima.');
                return;
            }
            
            if (utenti[username].password !== password) {
                mostraErrore('Password errata.');
                return;
            }
            
            // Login OK
            localStorage.setItem('utenteCorrente', username);
            window.location.href = 'pagine/la-mia-vita.html';
        }
    });
    </script>
</body>
</html>
