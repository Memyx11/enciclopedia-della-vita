<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg-gradient)"/>

  <!-- Central glow -->
  <circle cx="256" cy="256" r="180" fill="url(#glow-gradient)" opacity="0.3"/>

  <!-- Main star/compass shape -->
  <path d="M256 80 L280 200 L400 180 L300 256 L400 332 L280 312 L256 432 L232 312 L112 332 L212 256 L112 180 L232 200 Z"
        fill="url(#star-gradient)"
        stroke="rgba(255,255,255,0.3)"
        stroke-width="2"/>

  <!-- Inner circle -->
  <circle cx="256" cy="256" r="50" fill="url(#inner-gradient)"/>

  <!-- N letter -->
  <text x="256" y="275"
        font-family="Arial, sans-serif"
        font-size="60"
        font-weight="bold"
        fill="white"
        text-anchor="middle">N</text>

  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>

    <radialGradient id="glow-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#845ef7"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <linearGradient id="star-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#845ef7"/>
      <stop offset="50%" stop-color="#5c7cfa"/>
      <stop offset="100%" stop-color="#845ef7"/>
    </linearGradient>

    <linearGradient id="inner-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#845ef7"/>
      <stop offset="100%" stop-color="#5c7cfa"/>
    </linearGradient>
  </defs>
</svg>
